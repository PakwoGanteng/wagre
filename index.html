<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Data Rilisan</title>


<style>

/* ============================================================
   GLOBAL
   ============================================================ */

* {
  box-sizing: border-box;
}


html,
body {
  min-height: 100%;
}


body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  margin: 0;

  padding: 20px;

  color: #073042;

  background:
    linear-gradient(
      160deg,
      #bdf0ff 0%,
      #4fc3e8 28%,
      #1c8fd4 55%,
      #0b5fa8 78%,
      #063c73 100%
    );

  background-attachment:
    fixed;

  overflow-x:
    hidden;

}


/* ============================================================
   BUBBLE
   ============================================================ */

.bubble {

  position:
    fixed;

  bottom:
    -80px;

  border-radius:
    50%;

  background:
    radial-gradient(
      circle at 30% 30%,
      rgba(255,255,255,0.85),
      rgba(255,255,255,0.15) 60%,
      transparent 70%
    );

  animation:
    naik linear infinite;

  pointer-events:
    none;

  z-index:
    0;

}


@keyframes naik {

  0% {

    transform:
      translateY(0);

    opacity:
      0.9;

  }


  100% {

    transform:
      translateY(-115vh);

    opacity:
      0;

  }

}


/* ============================================================
   CARD
   ============================================================ */

.card {

  max-width:
    680px;

  margin:
    0 auto;

  position:
    relative;

  z-index:
    1;

  background:
    rgba(255,255,255,0.22);

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  border:
    1px solid
    rgba(255,255,255,0.55);

  border-radius:
    20px;

  padding:
    26px;

  box-shadow:
    0 8px 32px
    rgba(4,60,100,0.35);

}


h1 {

  font-size:
    21px;

  margin:
    0 0 4px;

  color:
    #04314d;

}


p.sub {

  color:
    #0b4e73;

  margin-top:
    0;

  margin-bottom:
    20px;

  font-size:
    14px;

}


label {

  display:
    block;

  font-size:
    13px;

  font-weight:
    700;

  margin-top:
    14px;

  margin-bottom:
    5px;

  color:
    #073855;

}


/* ============================================================
   INPUT / SELECT / TEXTAREA
   ============================================================ */

input,
select,
textarea {

  width:
    100%;

  padding:
    10px 12px;

  border:
    1px solid
    rgba(9,90,140,0.35);

  border-radius:
    10px;

  font-family:
    inherit;

  font-size:
    14px;

  background:
    rgba(255,255,255,0.68);

  color:
    #06304a;

  transition:
    0.18s ease;

}


textarea {

  resize:
    vertical;

  line-height:
    1.5;

  white-space:
    pre-wrap;

}


input:focus,
select:focus,
textarea:focus {

  outline:
    none;

  border-color:
    #0b8fd0;

  box-shadow:
    0 0 0 3px
    rgba(11,143,208,0.23);

  background:
    rgba(255,255,255,0.92);

}


input:disabled,
select:disabled {

  opacity:
    0.6;

  cursor:
    not-allowed;

}


.hidden {

  display:
    none !important;

}


/* ============================================================
   REQUIRED
   ============================================================ */

.required::after {

  content:
    " *";

  color:
    #b31414;

}


/* ============================================================
   VALIDATION ERROR
   ============================================================ */

.field-error {

  border-color:
    #d71920 !important;

  box-shadow:
    0 0 0 3px
    rgba(215,25,32,0.15)
    !important;

  background:
    rgba(255,235,235,0.95)
    !important;

}


.field-error-message {

  display:
    block;

  margin-top:
    4px;

  font-size:
    11px;

  font-weight:
    700;

  color:
    #a21318;

}


/* ============================================================
   GRID
   ============================================================ */

.grid2 {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    0 12px;

}


/* ============================================================
   NEW ARTIST
   ============================================================ */

.artist-new-wrap {

  display:
    flex;

  gap:
    8px;

  align-items:
    center;

  margin-top:
    7px;

}


.artist-new-wrap input {

  flex:
    1;

  min-width:
    0;

}


#simpanArtisBtn {

  width:
    auto;

  flex-shrink:
    0;

  padding:
    10px 15px;

  border:
    none;

  border-radius:
    10px;

  background:
    linear-gradient(
      135deg,
      #0ec4e8,
      #0b6fb8
    );

  color:
    white;

  font-size:
    13px;

  font-weight:
    700;

  cursor:
    pointer;

}


#simpanArtisBtn:disabled {

  opacity:
    0.55;

  cursor:
    not-allowed;

}


/* ============================================================
   BUTTON
   ============================================================ */

#muatBtn,
#simpanBtn {

  width:
    100%;

  margin-top:
    18px;

  border:
    none;

  border-radius:
    10px;

  padding:
    12px;

  font-size:
    14px;

  font-weight:
    700;

  cursor:
    pointer;

}


#muatBtn {

  background:
    rgba(255,255,255,0.72);

  color:
    #05517d;

  border:
    1px solid
    rgba(11,143,208,0.5);

}


#simpanBtn {

  background:
    linear-gradient(
      135deg,
      #0ec4e8,
      #0b6fb8
    );

  color:
    #fff;

  font-size:
    15px;

}


#muatBtn:disabled,
#simpanBtn:disabled {

  opacity:
    0.55;

  cursor:
    not-allowed;

}


#tambahLagu {

  margin-top:
    10px;

  padding:
    9px 14px;

  border:
    none;

  border-radius:
    10px;

  background:
    rgba(255,214,92,0.9);

  color:
    #5a3d00;

  font-weight:
    700;

  cursor:
    pointer;

}


/* ============================================================
   HR
   ============================================================ */

hr.pemisah {

  border:
    none;

  border-top:
    1px solid
    rgba(255,255,255,0.65);

  margin:
    22px 0;

}


/* ============================================================
   TRACK
   ============================================================ */

.lagu-row-wrap {

  border:
    1px solid
    rgba(255,255,255,0.6);

  border-radius:
    13px;

  padding:
    12px;

  margin-top:
    12px;

  background:
    rgba(255,255,255,0.16);

}


.track-title {

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    center;

  margin-bottom:
    8px;

  font-weight:
    800;

  color:
    #073855;

}


.hapusLagu {

  border:
    none;

  border-radius:
    8px;

  background:
    rgba(255,138,128,0.9);

  color:
    #5c0f0f;

  padding:
    7px 10px;

  cursor:
    pointer;

  font-weight:
    700;

}


.lagu-extra {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    8px;

  margin-top:
    8px;

}


.lyric-wrap {

  margin-top:
    10px;

}


.lyric-field {

  min-height:
    90px;

  height:
    90px;

  transition:
    height 0.2s ease;

}


.lyric-field.expanded {

  height:
    340px;

  min-height:
    340px;

}


.lyric-toolbar {

  display:
    flex;

  justify-content:
    flex-end;

  margin-top:
    6px;

}


.toggleLyricBtn {

  border:
    none;

  border-radius:
    8px;

  background:
    rgba(255,255,255,0.75);

  color:
    #07517a;

  padding:
    7px 11px;

  cursor:
    pointer;

  font-size:
    12px;

  font-weight:
    700;

}


/* ============================================================
   TOAST
   ============================================================ */

#toastContainer {

  position:
    fixed;

  top:
    18px;

  right:
    18px;

  z-index:
    99999;

  width:
    min(
      390px,
      calc(100vw - 36px)
    );

}


.toast {

  position:
    relative;

  padding:
    14px 42px 14px 15px;

  border-radius:
    12px;

  margin-bottom:
    10px;

  color:
    white;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,0.25);

  animation:
    toastIn
    0.25s ease;

}


.toast.success {

  background:
    linear-gradient(
      135deg,
      #159447,
      #087234
    );

}


.toast.error {

  background:
    linear-gradient(
      135deg,
      #d93a3a,
      #a51616
    );

}


.toast-title {

  font-size:
    14px;

  font-weight:
    800;

  margin-bottom:
    3px;

}


.toast-message {

  font-size:
    13px;

  line-height:
    1.4;

  white-space:
    pre-line;

}


.toast-close {

  position:
    absolute;

  right:
    10px;

  top:
    8px;

  border:
    none;

  background:
    transparent;

  color:
    white;

  font-size:
    20px;

  cursor:
    pointer;

}


@keyframes toastIn {

  from {

    opacity:
      0;

    transform:
      translateY(-12px);

  }


  to {

    opacity:
      1;

    transform:
      translateY(0);

  }

}


/* ============================================================
   HINT
   ============================================================ */

.hint {

  font-size:
    12px;

  line-height:
    1.5;

  color:
    #0b4e73;

}


/* ============================================================
   MOBILE
   ============================================================ */

@media (
  max-width: 600px
) {

  body {

    padding:
      10px;

  }


  .card {

    padding:
      18px;

  }


  .grid2,
  .lagu-extra {

    grid-template-columns:
      1fr;

  }


  .artist-new-wrap {

    align-items:
      stretch;

  }

}

</style>

</head>


<body>

<script>


// ============================================================
// WEB APP URL
// ============================================================

const WEBAPP_URL =
  "https://script.google.com/macros/s/AKfycbwdlPRUvYdm1Y24DrGbzf7hxMtQ5gTbTnRtYT6UJOMKcD_A-ok9cZ5YHvauLl_06hPGIQ/exec";


// ============================================================
// ELEMENT
// ============================================================

const pilihArtis =
  document.getElementById(
    "pilihArtis"
  );


const artisBaruWrap =
  document.getElementById(
    "artisBaruWrap"
  );


const artisBaruInput =
  document.getElementById(
    "artisBaruInput"
  );


const simpanArtisBtn =
  document.getElementById(
    "simpanArtisBtn"
  );


const pilihAlbum =
  document.getElementById(
    "pilihAlbum"
  );


const albumBaruInput =
  document.getElementById(
    "albumBaruInput"
  );


const muatBtn =
  document.getElementById(
    "muatBtn"
  );


const detailSection =
  document.getElementById(
    "detailSection"
  );


const laguContainer =
  document.getElementById(
    "laguContainer"
  );


const tambahLagu =
  document.getElementById(
    "tambahLagu"
  );


const simpanBtn =
  document.getElementById(
    "simpanBtn"
  );


const toastContainer =
  document.getElementById(
    "toastContainer"
  );


// ============================================================
// BACKGROUND
// ============================================================

(function buatBubble() {

  for (
    let i = 0;
    i < 14;
    i++
  ) {

    const b =
      document.createElement(
        "div"
      );


    b.className =
      "bubble";


    const size =
      8 +
      Math.random() * 26;


    b.style.width =
      size + "px";


    b.style.height =
      size + "px";


    b.style.left =
      Math.random() * 100 +
      "vw";


    b.style.animationDuration =
      (
        8 +
        Math.random() * 10
      ) +
      "s";


    b.style.animationDelay =
      (
        Math.random() * 10
      ) +
      "s";


    document.body
      .appendChild(
        b
      );

  }

})();


// ============================================================
// TOAST
// ============================================================

function showToast(
  type,
  title,
  message,
  duration = 5000
) {

  const toast =
    document.createElement(
      "div"
    );


  toast.className =
    "toast " +
    type;


  toast.innerHTML = `

    <button
      type="button"
      class="toast-close"
    >
      ×
    </button>

    <div class="toast-title"></div>

    <div class="toast-message"></div>

  `;


  toast
    .querySelector(
      ".toast-title"
    )
    .textContent =
      title;


  toast
    .querySelector(
      ".toast-message"
    )
    .textContent =
      message;


  toast
    .querySelector(
      ".toast-close"
    )
    .addEventListener(
      "click",
      function() {

        toast.remove();

      }
    );


  toastContainer
    .appendChild(
      toast
    );


  if (
    duration > 0
  ) {

    setTimeout(
      function() {

        if (
          toast.parentNode
        ) {

          toast.remove();

        }

      },
      duration
    );

  }

}


// ============================================================
// POST
// ============================================================

async function postData(
  payload
) {

  const response =
    await fetch(
      WEBAPP_URL,
      {
        method:
          "POST",

        body:
          JSON.stringify(
            payload
          )
      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "HTTP Error " +
      response.status
    );

  }


  return await response.json();

}


// ============================================================
// VALIDATION UI
// ============================================================

function clearValidationErrors() {

  document
    .querySelectorAll(
      ".field-error"
    )
    .forEach(
      function(el) {

        el.classList
          .remove(
            "field-error"
          );

      }
    );


  document
    .querySelectorAll(
      ".field-error-message"
    )
    .forEach(
      function(el) {

        el.remove();

      }
    );

}


// ============================================================
// MARK ERROR
// ============================================================

function markFieldError(
  element,
  message
) {

  if (!element) {

    return;

  }


  element
    .classList
    .add(
      "field-error"
    );


  const next =
    element
      .nextElementSibling;


  if (
    next &&
    next.classList &&
    next.classList.contains(
      "field-error-message"
    )
  ) {

    next.textContent =
      message;

    return;

  }


  const msg =
    document.createElement(
      "span"
    );


  msg.className =
    "field-error-message";


  msg.textContent =
    message;


  element.insertAdjacentElement(
    "afterend",
    msg
  );

}


// ============================================================
// REMOVE ERROR WHEN USER EDITS
// ============================================================

document.addEventListener(
  "input",
  function(event) {

    const target =
      event.target;


    if (
      target.classList.contains(
        "field-error"
      )
    ) {

      target.classList
        .remove(
          "field-error"
        );


      const next =
        target
          .nextElementSibling;


      if (
        next &&
        next.classList.contains(
          "field-error-message"
        )
      ) {

        next.remove();

      }

    }

  }
);


document.addEventListener(
  "change",
  function(event) {

    const target =
      event.target;


    if (
      target.classList.contains(
        "field-error"
      )
    ) {

      target.classList
        .remove(
          "field-error"
        );


      const next =
        target
          .nextElementSibling;


      if (
        next &&
        next.classList.contains(
          "field-error-message"
        )
      ) {

        next.remove();

      }

    }

  }
);


// ============================================================
// SCROLL ERROR
// ============================================================

function scrollToFirstError() {

  const first =
    document.querySelector(
      ".field-error"
    );


  if (!first) {

    return;

  }


  first.scrollIntoView({
    behavior:
      "smooth",

    block:
      "center"
  });


  setTimeout(
    function() {

      try {

        first.focus();

      }

      catch (e) {}

    },
    400
  );

}


// ============================================================
// DROPDOWN ARTIST
// ============================================================

function tambahArtisKeDropdown(
  namaArtis
) {

  if (!namaArtis) {

    return;

  }


  const exists =
    Array.from(
      pilihArtis.options
    )
    .some(
      function(option) {

        return (
          option.value ===
          namaArtis
        );

      }
    );


  if (exists) {

    return;

  }


  const option =
    document.createElement(
      "option"
    );


  option.value =
    namaArtis;


  option.textContent =
    namaArtis;


  const newOption =
    Array.from(
      pilihArtis.options
    )
    .find(
      function(item) {

        return (
          item.value ===
          "__baru__"
        );

      }
    );


  pilihArtis.insertBefore(
    option,
    newOption
  );

}


// ============================================================
// LOAD ARTIST
// ============================================================

async function muatDaftarArtis() {

  try {

    const response =
      await fetch(
        WEBAPP_URL +
        "?action=artis"
      );


    const result =
      await response.json();


    if (!result.ok) {

      throw new Error(
        result.error
      );

    }


    result.data.forEach(
      function(nama) {

        tambahArtisKeDropdown(
          nama
        );

      }
    );

  }

  catch (err) {

    showToast(
      "error",
      "Gagal Memuat Artis",
      err.message
    );

  }

}


// ============================================================
// SIMPAN ARTIS
// ============================================================

async function simpanArtisBaru() {

  clearValidationErrors();


  const nama =
    artisBaruInput
      .value
      .trim();


  if (!nama) {

    markFieldError(
      artisBaruInput,
      "Nama artis wajib diisi."
    );


    showToast(
      "error",
      "Artis Belum Lengkap",
      "Nama artis wajib diisi."
    );


    scrollToFirstError();

    return;

  }


  simpanArtisBtn.disabled =
    true;


  simpanArtisBtn.textContent =
    "Menyimpan...";


  try {

    const result =
      await postData({

        action:
          "simpanArtis",

        namaArtis:
          nama

      });


    if (!result.ok) {

      if (
        result.errors
      ) {

        result.errors.forEach(
          function(err) {

            if (
              err.field ===
              "namaArtis"
            ) {

              markFieldError(
                artisBaruInput,
                err.message
              );

            }

          }
        );

      }


      throw new Error(
        result.error
      );

    }


    tambahArtisKeDropdown(
      result.sheet
    );


    pilihArtis.value =
      result.sheet;


    artisBaruWrap
      .classList
      .add(
        "hidden"
      );


    artisBaruInput.value =
      "";


    pilihAlbum.disabled =
      false;


    pilihAlbum.innerHTML =
      `
      <option value="">
        -- pilih album --
      </option>

      <option value="__baru__">
        + Tambah Album Baru
      </option>
      `;


    pilihAlbum.value =
      "__baru__";


    albumBaruInput
      .classList
      .remove(
        "hidden"
      );


    albumBaruInput.value =
      "";


    showToast(

      "success",

      "Artis Tersimpan",

      result.created

        ? 'Tab "' +
          result.sheet +
          '" berhasil dibuat.'

        : 'Artis "' +
          result.sheet +
          '" sudah tersedia.',

      3500

    );


    albumBaruInput.focus();

  }

  catch (err) {

    showToast(
      "error",
      "Gagal Menyimpan Artis",
      err.message,
      7000
    );


    scrollToFirstError();

  }

  finally {

    simpanArtisBtn.disabled =
      false;


    simpanArtisBtn.textContent =
      "Simpan";

  }

}

async function muatDaftarAlbum(
  artis
) {

  pilihAlbum.disabled =
    true;


  pilihAlbum.innerHTML =
    `
    <option value="">
      Memuat...
    </option>
    `;


  try {

    const response =
      await fetch(

        WEBAPP_URL +

        "?action=album&artis=" +

        encodeURIComponent(
          artis
        )

      );


    const result =
      await response.json();


    if (!result.ok) {

      throw new Error(
        result.error
      );

    }


    pilihAlbum.innerHTML =
      `
      <option value="">
        -- pilih album --
      </option>

      <option value="__baru__">
        + Tambah Album Baru
      </option>
      `;


    result.data.forEach(
      function(album) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          album;


        option.textContent =
          album;


        const tambahBaru =
          pilihAlbum
            .querySelector(
              'option[value="__baru__"]'
            );


        pilihAlbum.insertBefore(
          option,
          tambahBaru
        );

      }
    );


    pilihAlbum.disabled =
      false;

  }

  catch (err) {

    pilihAlbum.innerHTML =
      `
      <option value="">
        Gagal memuat album
      </option>
      `;


    pilihAlbum.disabled =
      false;


    showToast(
      "error",
      "Gagal Memuat Album",
      err.message
    );

  }

}

    !pilihArtis.value ||
    pilihArtis.value ===

  return pilihArtis.value;

}


function currentAlbum() {

    "__baru__"
  ) {

    return albumBaruInput
      .value

  return pilihAlbum.value;

}

    .value =
      data.lyric || "";


  // ==========================================================

          .classList
          .toggle(
            "expanded"
          );


      toggle.textContent =
        expanded
          ? "⤡ Perkecil"
          : "⤢ Perbesar";


      if (expanded) {

        textarea.focus();

      }

    }
  );


  // ==========================================================
  // DELETE TRACK
  // ==========================================================

  wrap
    .querySelector(
      ".hapusLagu"
    )
    .addEventListener(
      "click",
      function() {

        wrap.remove();

        updateTrackNumbers();

      }
    );


  laguContainer
    .appendChild(
      wrap
    );


  updateTrackNumbers();

          );

    }
  );

// ============================================================
// NORMALIZE DATE
// ============================================================

function normalizeDate(
  value
) {

  if (!value) {

    return "";

  }


  const text =
    String(value);


  if (
    /^\d{4}-\d{2}-\d{2}$/.test(
      text
    )
  ) {

    return text;

  }


  const date =
    new Date(
      value
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return "";

  }


  const y =
    date.getFullYear();


  const m =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const d =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    y +
    "-" +
    m +
    "-" +
    d
  );

}

// ============================================================
// FRONTEND VALIDATION
// ============================================================

function validateForm() {

  clearValidationErrors();


  const errors =
    [];


  function required(
    element,
    message
  ) {

    if (
      !element ||
      String(
        element.value || ""
      ).trim() === ""
    ) {

      errors.push({
        element:
          element,

        message:
          message
      });

    }

  }


  // ==========================================================
  // ALBUM FIELD
  // ==========================================================

  required(
    document.getElementById(
      "upc"
    ),
    "UPC wajib diisi."
  );


  required(
    document.getElementById(
      "agregator"
    ),
    "Agregator wajib dipilih."
  );


  required(
    document.getElementById(
      "statusRilisan"
    ),
    "Status wajib dipilih."
  );


  required(
    document.getElementById(
      "splitshare"
    ),
    "Splitshare wajib dipilih."
  );


  required(
    document.getElementById(
      "splitshareStatus"
    ),
    "Splitshare Status wajib dipilih."
  );


  required(
    document.getElementById(
      "kodeKatalog"
    ),
    "Kode Katalog wajib diisi."
  );


  const tahun =
    document.getElementById(
      "tahunProduksi"
    );


  required(
    tahun,
    "Tahun Produksi wajib diisi."
  );


  if (
    tahun.value.trim() &&
    !/^\d{4}$/.test(
      tahun.value.trim()
    )
  ) {

    errors.push({
      element:
        tahun,

      message:
        "Gunakan format tahun 4 digit, contoh 2026."
    });

  }


  required(
    document.getElementById(
      "namaLabel"
    ),
    "Nama Label wajib diisi."
  );


  required(
    document.getElementById(
      "copyright"
    ),
    "Copyright wajib diisi."
  );


  required(
    document.getElementById(
      "publisher"
    ),
    "Publisher wajib diisi."
  );


  required(
    document.getElementById(
      "genre"
    ),
    "Genre wajib diisi."
  );


  required(
    document.getElementById(
      "subGenre"
    ),
    "Sub Genre wajib diisi."
  );


  required(
    document.getElementById(
      "tanggalUpload"
    ),
    "Tanggal Upload wajib diisi."
  );


  required(
    document.getElementById(
      "tanggalRilis"
    ),
    "Tanggal Rilis wajib diisi."
  );


  required(
    document.getElementById(
      "keterangan"
    ),
    "Keterangan wajib diisi."
  );


  // ==========================================================
  // TRACKS
  // ==========================================================

  const rows =
    Array.from(
      laguContainer
        .querySelectorAll(
          ".lagu-row-wrap"
        )
    );


  if (
    rows.length === 0
  ) {

    showToast(
      "error",
      "Belum Ada Lagu",
      "Tambahkan minimal satu lagu."
    );


    return false;

  }


  rows.forEach(
    function(
      row,
      index
    ) {

      const no =
        index + 1;


      required(
        row.querySelector(
          ".judulLagu"
        ),
        "Track " +
        no +
        " - Judul Lagu wajib diisi."
      );


      required(
        row.querySelector(
          ".isrc"
        ),
        "Track " +
        no +
        " - ISRC wajib diisi."
      );


      required(
        row.querySelector(
          ".komposer"
        ),
        "Track " +
        no +
        " - Komposer wajib diisi."
      );


      required(
        row.querySelector(
          ".songwriter"
        ),
        "Track " +
        no +
        " - Songwriter wajib diisi."
      );


      required(
        row.querySelector(
          ".lyric-field"
        ),
        "Track " +
        no +
        " - Lyric wajib diisi."
      );


      required(
        row.querySelector(
          ".type"
        ),
        "Track " +
        no +
        " - Type wajib dipilih."
      );

    }
  );


  // ==========================================================
  // APPLY ERRORS
  // ==========================================================

  errors.forEach(
    function(error) {

      markFieldError(
        error.element,
        error.message
      );

    }
  );


  if (
    errors.length > 0
  ) {

    showToast(

      "error",

      "Form Belum Lengkap",

      "Ada " +
      errors.length +
      " kolom yang perlu diperbaiki. Periksa kolom berwarna merah.",

      7000

    );


    scrollToFirstError();


    return false;

  }


  return true;

}


// ============================================================
// APPLY SERVER ERRORS
// ============================================================

function applyServerErrors(
  errors
) {

  if (
    !Array.isArray(
      errors
    )
  ) {

    return;

  }


  const map = {

    upc:
      "upc",

    agregator:
      "agregator",

    status:
      "statusRilisan",

    splitshare:
      "splitshare",

    splitshareStatus:
      "splitshareStatus",

    kodeKatalog:
      "kodeKatalog",

    tahunProduksi:
      "tahunProduksi",

    namaLabel:
      "namaLabel",

    copyright:
      "copyright",

    publisher:
      "publisher",

    genre:
      "genre",

    subGenre:
      "subGenre",

    tanggalUpload:
      "tanggalUpload",

    tanggalRilis:
      "tanggalRilis",

    keterangan:
      "keterangan"

  };


  errors.forEach(
    function(error) {

      // ======================================================
      // TRACK ERROR
      // ======================================================

      if (
        error.trackIndex !== undefined &&
        error.trackIndex !== null
      ) {

        const rows =
          laguContainer
            .querySelectorAll(
              ".lagu-row-wrap"
            );


        const row =
          rows[
            error.trackIndex
          ];


        if (!row) {

          return;

        }


        const fieldMap = {

          judulLagu:
            ".judulLagu",

          isrc:
            ".isrc",

          komposer:
            ".komposer",

          songwriter:
            ".songwriter",

          lyric:
            ".lyric-field",

          type:
            ".type"

        };


        const selector =
          fieldMap[
            error.field
          ];


        if (selector) {

          const element =
            row.querySelector(
              selector
            );


          markFieldError(
            element,
            error.message
          );


          /*
           * Kalau error lyric,
           * otomatis extend supaya terlihat.
           */

          if (
            error.field ===
            "lyric"
          ) {

            const lyric =
              row.querySelector(
                ".lyric-field"
              );


            lyric.classList
              .add(
                "expanded"
              );


            row.querySelector(
              ".toggleLyricBtn"
            )
            .textContent =
              "⤡ Perkecil";

          }

        }


        return;

      }


      // ======================================================
      // ALBUM ERROR
      // ======================================================

      const id =
        map[
          error.field
        ];


      if (id) {

        markFieldError(
          document.getElementById(
            id
          ),
          error.message
        );

      }

    }
  );


  scrollToFirstError();

}


// ============================================================
// RESET HOME
// ============================================================

function kembaliKeHalamanUtama() {

  clearValidationErrors();


  // ARTIST

  pilihArtis.value =
    "";


  artisBaruWrap
    .classList
    .add(
      "hidden"
    );


  artisBaruInput.value =
    "";


  // ALBUM

  pilihAlbum.disabled =
    true;


  pilihAlbum.innerHTML =
    `
    <option value="">
      -- pilih artis dulu --
    </option>
    `;


  albumBaruInput
    .classList
    .add(
      "hidden"
    );


  albumBaruInput.value =
    "";


  // DETAIL

  detailSection
    .classList
    .add(
      "hidden"
    );


  laguContainer.innerHTML =
    "";


  // BUTTON

  muatBtn.disabled =
    true;


  muatBtn.textContent =
    "Tampilkan Data";


  simpanBtn.disabled =
    false;


  simpanBtn.textContent =
    "Simpan Data Rilisan";


  // TOP

  window.scrollTo({
    top:
      0,

    behavior:
      "smooth"
  });

}


// ============================================================
// SAVE
// ============================================================

simpanBtn.addEventListener(
  "click",
  async function() {

    const artis =
      currentArtist();


    const album =
      currentAlbum();


    if (!artis) {

      showToast(
        "error",
        "Artis Belum Dipilih",
        "Pilih atau buat artis terlebih dahulu."
      );

      return;

    }


    if (!album) {

      showToast(
        "error",
        "Album Belum Diisi",
        "Judul album wajib diisi."
      );


      if (
        pilihAlbum.value ===
        "__baru__"
      ) {

        markFieldError(
          albumBaruInput,
          "Judul album wajib diisi."
        );


        scrollToFirstError();

      }


      return;

    }


    // ========================================================
    // FRONT VALIDATION
    // ========================================================

    if (
      !validateForm()
    ) {

      return;

    }


    const lagu =
      collectTrackData();


    const payload = {

      action:
        "simpanAlbum",

      namaArtis:
        artis,

      judulAlbum:
        album,

      upc:
        document
          .getElementById(
            "upc"
          )
          .value
          .trim(),

      agregator:
        document
          .getElementById(
            "agregator"
          )
          .value,

      status:
        document
          .getElementById(
            "statusRilisan"
          )
          .value,

      splitshare:
        document
          .getElementById(
            "splitshare"
          )
          .value,

      splitshareStatus:
        document
          .getElementById(
            "splitshareStatus"
          )
          .value,

      kodeKatalog:
        document
          .getElementById(
            "kodeKatalog"
          )
          .value
          .trim(),

      tahunProduksi:
        document
          .getElementById(
            "tahunProduksi"
          )
          .value
          .trim(),

      namaLabel:
        document
          .getElementById(
            "namaLabel"
          )
          .value
          .trim(),

      copyright:
        document
          .getElementById(
            "copyright"
          )
          .value
          .trim(),

      publisher:
        document
          .getElementById(
            "publisher"
          )
          .value
          .trim(),

      genre:
        document
          .getElementById(
            "genre"
          )
          .value
          .trim(),

      subGenre:
        document
          .getElementById(
            "subGenre"
          )
          .value
          .trim(),

      tanggalUpload:
        document
          .getElementById(
            "tanggalUpload"
          )
          .value,

      tanggalRilis:
        document
          .getElementById(
            "tanggalRilis"
          )
          .value,

      keterangan:
        document
          .getElementById(
            "keterangan"
          )
          .value
          .trim(),

      lagu:
        lagu

    };


    // ========================================================
    // SEND
    // ========================================================

    simpanBtn.disabled =
      true;


    simpanBtn.textContent =
      "Menyimpan...";


    try {

      const result =
        await postData(
          payload
        );


      // ======================================================
      // SERVER VALIDATION ERROR
      // ======================================================

      if (!result.ok) {

        clearValidationErrors();


        if (
          Array.isArray(
            result.errors
          )
        ) {

          applyServerErrors(
            result.errors
          );


          showToast(

            "error",

            "Data Belum Bisa Disimpan",

            result.error +
            "\nPeriksa kolom berwarna merah.",

            8000

          );

        }

        else {

          showToast(
            "error",
            "Gagal Menyimpan",
            result.error ||
            "Terjadi kesalahan.",
            8000
          );

        }


        return;

      }


      // ======================================================
      // SUCCESS
      // ======================================================

      showToast(

        "success",

        "Berhasil Disimpan",

        'Album "' +
        album +
        '" berhasil disimpan ke tab "' +
        result.sheet +
        '".',

        5000

      );


      /*
       * HANYA RESET KALAU BACKEND
       * SUDAH MEMBERIKAN ok:true
       */

      kembaliKeHalamanUtama();


    }

    catch (err) {

      /*
       * ERROR NETWORK / APPS SCRIPT
       *
       * FORM TIDAK DIRESET.
       */

      showToast(

        "error",

        "Gagal Menyimpan",

        "Terjadi kesalahan saat mengirim data:\n" +
        err.message +
        "\n\nData pada form tetap dipertahankan.",

        10000

      );

    }

    finally {

      simpanBtn.disabled =
        false;


      simpanBtn.textContent =
        "Simpan Data Rilisan";

    }

  }
);


// ============================================================
// INIT
// ============================================================

muatDaftarArtis();

</script>
